name: Performance Monitor

on:
  schedule:
    - cron: '0 1 * * *' # 每天运行
  workflow_dispatch:

permissions:
  contents: write # 必须赋予写权限以更新缓存文件

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python performance_monitor.py

      - name: Commit and push cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_results.json
          git commit -m "Update performance cache" || echo "No changes to commit"
          git push
